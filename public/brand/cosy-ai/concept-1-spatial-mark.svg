<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="COSY AI spatial mark">
  <!-- Concept 1: Ultra-minimal abstract spatial / AST / viewport mark -->
  <rect width="128" height="128" rx="28" fill="#0A0A0C"/>
  <!-- Outer viewport frame -->
  <rect x="28" y="28" width="72" height="72" rx="10" stroke="#FFFFFF" stroke-width="3.5"/>
  <!-- Inner layout layer (offset) -->
  <rect x="40" y="40" width="48" height="48" rx="6" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>
  <!-- AST node triad + edges (spatial context) -->
  <circle cx="52" cy="54" r="4" fill="#FFFFFF"/>
  <circle cx="76" cy="54" r="4" fill="#FFFFFF"/>
  <circle cx="64" cy="74" r="4" fill="#FFFFFF"/>
  <path d="M52 54H76M52 54L64 74M76 54L64 74" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" opacity="0.9"/>
  <!-- Precision accent: single hyper-blue node (restrained) -->
  <circle cx="64" cy="74" r="2" fill="#2563EB"/>
</svg>
