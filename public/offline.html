<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <title>Offline — COSY.AI</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0a0a0c;
        color: #fafafa;
        font-family:
          Inter,
          -apple-system,
          "SF Pro Display",
          ui-sans-serif,
          system-ui,
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
        font-weight: 800;
      }
      h1 span {
        color: #6366f1;
      }
      p {
        margin: 0;
        max-width: 28rem;
        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        color: #38bdf8;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark" aria-hidden="true">
        <svg
          width="64"
          height="64"
          viewBox="0 0 64 64"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect width="64" height="64" rx="14" fill="#18181B" stroke="#27272A" stroke-width="2" />
          <path
            d="M18 22L30 32L18 42"
            stroke="#818CF8"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M46 22L34 32L46 42"
            stroke="#38BDF8"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="32" cy="32" r="3.5" fill="#6366F1" />
        </svg>
      </div>
      <h1>COSY<span>.AI</span></h1>
      <p>You’re offline. Reconnect to keep building with the Visual Code Engine.</p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
